name: Generate all electronic physics project branches

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/generate_projects.py'
      - '.github/workflows/generate-project-branches.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-electronic-physics-projects
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Generate and push 50 project branches
        run: python3 .github/scripts/generate_projects.py

      - name: Verify expected remote branch count
        shell: bash
        run: |
          git fetch --all --prune
          count=$(git branch -r | grep -E 'origin/(amir|mostafa|ahmed)-' | wc -l)
          echo "Generated project branches: $count"
          test "$count" -eq 50
